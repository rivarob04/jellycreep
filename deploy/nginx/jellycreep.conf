# JellyCreep behind nginx + Authentik forward auth (single application).
#
# Replace:
#   jellycreep.example.com          your hostname
#   ssl_certificate paths           your certs
#   http://jellycreep:8484          JellyCreep — use http://127.0.0.1:8484 if nginx runs on the host
#   http://authentik-server:9000    your Authentik server (embedded outpost) — or its LAN IP:9000
#
# Authentik side: Applications → Create with provider → Proxy Provider →
#   "Forward auth (single application)", external host https://jellycreep.example.com,
#   then add it to the embedded outpost.

upstream jellycreep {
    server jellycreep:8484;
    keepalive 16;
}

server {
    listen 80;
    server_name jellycreep.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;                       # nginx < 1.25.1: delete this line and use "listen 443 ssl http2;" 
    server_name jellycreep.example.com;

    ssl_certificate     /etc/nginx/certs/jellycreep.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/jellycreep.example.com/privkey.pem;

    # Authentik sends large headers/cookies
    proxy_buffers 8 16k;
    proxy_buffer_size 32k;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- The web UI: protected by Authentik (MFA) -----------------------------
    location / {
        auth_request     /outpost.goauthentik.io/auth/nginx;
        error_page       401 = @goauthentik_proxy_signin;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header       Set-Cookie $auth_cookie;

        # Pass who logged in to JellyCreep. These always overwrite anything the
        # browser sent, so they can't be spoofed.
        auth_request_set $authentik_username $upstream_http_x_authentik_username;
        auth_request_set $authentik_groups   $upstream_http_x_authentik_groups;
        auth_request_set $authentik_email    $upstream_http_x_authentik_email;
        proxy_set_header X-authentik-username $authentik_username;
        proxy_set_header X-authentik-groups   $authentik_groups;
        proxy_set_header X-authentik-email    $authentik_email;
        # Optional but recommended: the same value as TRUSTED_PROXY_SECRET in JellyCreep, so nothing
        # else on your network can pretend to be this proxy.
        # proxy_set_header X-JellyCreep-Proxy-Secret "change-me-to-a-long-random-string";

        proxy_pass http://jellycreep;
    }

    # ---- Jellyfin-user pages: no Authentik, JellyCreep checks the Jellyfin password itself ----
    # (only needed if Settings → Sign-in is on; users open https://<host>/me)
    location ~ ^/(login|logout|me|partials/me)(/|$) {
        proxy_set_header X-authentik-username "";
        proxy_set_header X-authentik-groups   "";
        proxy_set_header X-authentik-email    "";
        proxy_pass http://jellycreep;
    }
    location /static/ {
        proxy_pass http://jellycreep;
    }

    # ---- API + webhooks: no Authentik, JellyCreep checks its own API token ----
    # (Sonarr/Radarr/Seerr/Jellyfin webhooks and apps like Homepage can't do MFA.)
    location /api/ {
        # Strip identity headers so nobody can pretend to be logged in here.
        proxy_set_header X-authentik-username "";
        proxy_set_header X-authentik-groups   "";
        proxy_set_header X-authentik-email    "";
        proxy_pass http://jellycreep;
    }

    location = /healthz {
        proxy_set_header X-authentik-username "";
        proxy_pass http://jellycreep;
    }

    # ---- Authentik outpost endpoints ------------------------------------------
    location /outpost.goauthentik.io {
        proxy_pass              http://authentik-server:9000/outpost.goauthentik.io;
        proxy_set_header        Host $host;
        proxy_set_header        X-Original-URL $scheme://$http_host$request_uri;
        add_header              Set-Cookie $auth_cookie;
        auth_request_set        $auth_cookie $upstream_http_set_cookie;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
    }

    location @goauthentik_proxy_signin {
        internal;
        add_header Set-Cookie $auth_cookie;
        return 302 /outpost.goauthentik.io/start?rd=$scheme://$http_host$request_uri;
    }
}
