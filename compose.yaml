# JellyCreep — made for Dockhand (works with plain `docker compose` too).
#
# This stack only runs JellyCreep. Jellyfin, Jellystat, Wizarr, the *arrs, SABnzbd,
# qBittorrent and Seerr are your existing containers/servers — JellyCreep
# connects to them by URL + API key (directly, or through Authentik).
#
# In Dockhand: Stacks → Add from Git → this repo, branch `main`, compose path `compose.yaml`.
# No variables are required — JellyCreep generates its own secret key on first start.
# Everything is optional — see .env.example. Apps can also be added later
# from Settings in the web UI.

name: jellycreep

services:
  jellycreep:
    image: ghcr.io/rivarob04/jellycreep:latest
    build: .                      # used if the image can't be pulled
    container_name: jellycreep
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Toronto}
      # Optional: if blank, JellyCreep generates one and keeps it in its data volume.
      SECRET_KEY: ${JELLYCREEP_SECRET_KEY:-}
      BASE_URL: ${JELLYCREEP_BASE_URL:-}                 # e.g. https://jellycreep.example.com
      # authentik_forward (behind an Authentik outpost) | oidc (log in via Authentik) | none
      AUTH_MODE: ${AUTH_MODE:-authentik_forward}
      # Only requests coming *from* these addresses may set X-authentik-* headers.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32,172.16.0.0/12}
      TRUSTED_PROXY_SECRET: ${TRUSTED_PROXY_SECRET:-}
      ADMIN_GROUP: ${ADMIN_GROUP:-jellycreep-admins}
      # Let Jellyfin users sign in with their Jellyfin password (can also be toggled in Settings → Sign-in)
      JELLYFIN_LOGIN: ${JELLYFIN_LOGIN:-false}
      ADMIN_LOGIN_URL: ${ADMIN_LOGIN_URL:-}               # optional "Sign in with Authentik" link on the login page
      OIDC_ISSUER: ${OIDC_ISSUER:-}                       # https://auth.example.com/application/o/jellycreep
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      POLL_INTERVAL: ${POLL_INTERVAL:-10}
      MIN_WATCH_SECONDS: ${MIN_WATCH_SECONDS:-30}
      WATCHED_PERCENT: ${WATCHED_PERCENT:-90}
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-0}

      # --- Apps to connect (optional; first-run only — manage them in Settings afterwards) ---
      # <APP>_PROXY_AUTH: none | authentik_basic | authentik_token | headers
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      JELLYFIN_PROXY_AUTH: ${JELLYFIN_PROXY_AUTH:-}
      JELLYSTAT_URL: ${JELLYSTAT_URL:-}                   # your existing Jellystat, e.g. http://jellystat:3000
      JELLYSTAT_API_KEY: ${JELLYSTAT_API_KEY:-}
      JELLYSTAT_PROXY_AUTH: ${JELLYSTAT_PROXY_AUTH:-}
      SONARR_URL: ${SONARR_URL:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      SONARR_PROXY_AUTH: ${SONARR_PROXY_AUTH:-}
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      RADARR_PROXY_AUTH: ${RADARR_PROXY_AUTH:-}
      LIDARR_URL: ${LIDARR_URL:-}
      LIDARR_API_KEY: ${LIDARR_API_KEY:-}
      LIDARR_PROXY_AUTH: ${LIDARR_PROXY_AUTH:-}
      PROWLARR_URL: ${PROWLARR_URL:-}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
      PROWLARR_PROXY_AUTH: ${PROWLARR_PROXY_AUTH:-}
      BAZARR_URL: ${BAZARR_URL:-}
      BAZARR_API_KEY: ${BAZARR_API_KEY:-}
      BAZARR_PROXY_AUTH: ${BAZARR_PROXY_AUTH:-}
      SABNZBD_URL: ${SABNZBD_URL:-}
      SABNZBD_API_KEY: ${SABNZBD_API_KEY:-}
      SABNZBD_PROXY_AUTH: ${SABNZBD_PROXY_AUTH:-}
      QBITTORRENT_URL: ${QBITTORRENT_URL:-}
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:-}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:-}
      QBITTORRENT_PROXY_AUTH: ${QBITTORRENT_PROXY_AUTH:-}
      JELLYSEERR_URL: ${JELLYSEERR_URL:-}
      JELLYSEERR_API_KEY: ${JELLYSEERR_API_KEY:-}
      JELLYSEERR_PROXY_AUTH: ${JELLYSEERR_PROXY_AUTH:-}
      WIZARR_URL: ${WIZARR_URL:-}                         # e.g. http://wizarr:5690
      WIZARR_API_KEY: ${WIZARR_API_KEY:-}
      WIZARR_PROXY_AUTH: ${WIZARR_PROXY_AUTH:-}
      # Authentik service account used for apps behind Authentik
      AUTHENTIK_URL: ${AUTHENTIK_URL:-}
      AUTHENTIK_SERVICE_USERNAME: ${AUTHENTIK_SERVICE_USERNAME:-}
      AUTHENTIK_SERVICE_APP_PASSWORD: ${AUTHENTIK_SERVICE_APP_PASSWORD:-}
    volumes:
      - jellycreep-data:/data
    ports:
      # Bound to localhost by default so nobody on the LAN can bypass Authentik.
      # Your reverse proxy / Authentik outpost should reach it on the shared network instead.
      - "${JELLYCREEP_BIND:-127.0.0.1}:${JELLYCREEP_PORT:-8484}:8484"
    networks:
      - default
      - proxy

volumes:
  jellycreep-data:

networks:
  # Shared with your reverse proxy / Authentik outpost — and with Jellyfin, Jellystat
  # and the *arrs if they're in Docker — so JellyCreep can reach them by container name.
  # Create it once:  docker network create proxy   (or set PROXY_NETWORK to yours)
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
